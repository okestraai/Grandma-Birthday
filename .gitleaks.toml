# Known, harmless matches, so a scan of this repository only reports real secrets.
[extend]
useDefault = true

[allowlist]
description = "Public development values"
regexes = [
  # Azurite's built-in development account key, published by Microsoft for the local emulator.
  # The API refuses to start with it when NODE_ENV=production.
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''',
]
paths = [
  # Made-up tokens in unit tests.
  '''apps/api/src/.*\.spec\.ts''',
]
